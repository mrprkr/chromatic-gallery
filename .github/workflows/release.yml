name: Release

# Publishes to npm and creates a GitHub release when a version tag is pushed:
#
#   pnpm version patch   # or minor / major; bumps package.json and tags
#   git push --follow-tags
#
# Publishes through npm trusted publishing (OIDC), so no npm token is stored.
# On npmjs.com: package Settings -> Trusted publishing -> GitHub Actions,
# repository mrprkr/chromatic-gallery, workflow release.yml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # prepublishOnly runs typecheck, tests, build and publint first.
      - name: Publish to npm
        run: pnpm publish --provenance --access public --no-git-checks
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
